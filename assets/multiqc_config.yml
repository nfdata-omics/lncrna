# --- Report metadata ---------------------------------------------------------
title: "lncRNA analysis"
subtitle: "National Facility for Data Handling and Analysis"
intro_text: "Results Report"

# --- Logo --------------------------------------------------------------------
custom_logo: "ht_logo.png"
custom_logo_url: "https://humantechnopole.it/it/facility/piattaforma-nazionale-per-la-gestione-e-lanalisi-dei-dati/"

report_comment: >
  This report shows the results on the analyses performed for lncRNAs and has been generated by the <a href="https://github.com/nfdata-omics/lncrna/tree/dev" target="_blank">nfdata-omics/lncrna</a>
  analysis pipeline.
report_section_order:
  fastqc_raw:
    order: 10000
  cutadapt:
    order: 9000
  fastqc_trimmed:
    order: 8000
  star:
    order: 7000
  samtools:
    order: 6000
  salmon:
    order: 5000
  picard:
    order: 4000
  de_summary:
    order: 3000
  pca:
    order: 2900
  mds:
    order: 2800
  heatmap_global:
    order: 2700
  volcanoplot:
    order: 2600
  heatmap_de:
    order: 2500
  lncrna_prediction:
    order: 2000
  "nfdata-omics-lncrna-methods-description":
    order: -1000
  software_versions:
    order: -1001
  "nfdata-omics-lncrna-summary":
    order: -1002

export_plots: true

disable_version_detection: true

# Grouping R1 and R2 in the same table entry
table_sample_merge:
  "R1":
    - "_R1"
    - type: regex
      pattern: "[_.-][rR]?1$"
  "R2":
    - "_R2"
    - type: regex
      pattern: "[_.-][rR]?2$"

# Option to disable sample name cleaning if desired
fn_clean_sample_names: true
use_filename_as_sample_name: false

module_order:
  - fastqc:
      name: "FastQC (raw)"
      anchor: "fastqc_raw"
      info: "This section of the report shows FastQC results on the input files."
      path_filters:
        - "**/*raw*fastqc.zip"
  - cutadapt:
      name: "Trimming"
      anchor: "cutadapt"
      info: "Trimming and adapter removal"
  - fastqc:
      name: "FastQC (trimmed)"
      anchor: "fastqc_trimmed"
      info: "This section of the report shows FastQC results after adapter trimming."
      path_filters:
        - "**/*trim*fastqc.zip"
  - star:
      anchor: "star"
      name: "Alignment"
      info: |
        This section of the report shows the results of the STAR alignment step.
        STAR is a fast and accurate aligner for RNA-Seq data.
  - samtools:
      anchor: "samtools"
      name: "Post Alignment QC - samtools"
      info: |
        This section of the report shows the results of the post-alignment quality control
        steps performed by samtools.
  - picard:
      anchor: "picard"
      name: "Post Alignment QC - Picard"
      info: |
        This section of the report shows the results of the post-alignment quality control
        steps performed by Picard.
  - salmon:
      anchor: "salmon"
      name: "Pseudo alignment"
  - featurecounts:
      anchor: featurecounts
      name: "Quantification"

#Search pattern
sp:
  cutadapt:
    fn: "*trimming_report.txt"
  fastp:
    fn: "*.fastp.json"
  salmon/meta:
    fn: "meta_info.json"
  lncrna_prediction:
    fn: "*.prediction_summary_lncrna.tsv"
  samtools/stats:
    fn: "*.stats"
  samtools/flagstat:
    fn: "*.flagstat"
  samtools/idxstats:
    fn: "*.idxstats*"
  picard/markdups:
    fn: "*.MarkDuplicates.metrics.txt"
  mds:
    fn_re: "MDS_mqc.png"
  pca:
    fn_re: "PCA_mqc.png"
  heatmap_global:
    fn_re: "heatmap_global_mqc.png"
  volcanoplot:
    fn_re: "volcanoplot_*_mqc.png"
  heatmap_de:
    fn_re: "heatmap_DE_top20*_mqc.png"
  de_summary:
    fn: "DGE_summary_*.tsv"

custom_data:
  de_summary:
    id: "de_summary"
    section_name: "DGE Summary"
    description:
      "Differential Gene Expression (DGE) analysis was performed using the R package edgeR. By performing the p-value adjustment on a reduced set of genes, this approach increases the overall statistical power.
      Only genes identified as expressed in each comparison were tested. Significance was defined setting a threshold of False Discovery Rate < 0.05.
      For each performed comparison, a table with complete results is produced. In each table, for each gene is reported:
      • Base mean (the average normalized expression calculated across all the considered samples)
      • log2 Fold Change<br>
      • raw p-value<br>
      • p-value adjusted with the Benjamini-Hochberg correction (FDR value). Genes with NA values were discarded by the independent filtering procedure and should not be considered.
      • significance indexes according to each considered FDR cutoff ('up' for significantly up-regulated genes, 'down' for significantly down-regulated genes and 'not_sign' for all the not significant genes)
      • Gene information and annotations when available (e.g., Ensemble gene ID, genomic location of the gene etc.)"
    plot_type: "table"
    pconfig:
      id: "de_summary"
      title: "DGE Summary"

  pca:
    parent_id: de_summary
    parent_name: "Differential Expression Analysis"
    id: "pca"
    anchor: "pca"
    section_name: "PCA"
    description: |
      "PCA plot."

  mds:
    parent_id: de_summary
    parent_name: "Differential Expression Analysis"
    id: "mds"
    anchor: "mds"
    section_name: "MDS"
    description: |
      "MDS plot."

  heatmap_global:
    parent_id: de_summary
    parent_name: "Differential Expression Analysis"
    id: "heatmap_global"
    anchor: "heatmap_global"
    section_name: "Heatmap top variable genes"
    description: |
      "Heatmap top variable genes"

  volcanoplot:
    parent_id: de_summary
    parent_name: "Differential Expression Analysis"
    id: "volcanoplot"
    anchor: "volcanoplot"
    section_name: "Volcanoplot"
    description: |
      "Volcanoplot (|LFC| ≥ 0.5, FDR ≤ 0.05)."

  heatmap_de:
    parent_id: de_summary
    parent_name: "Differential Expression Analysis"
    id: "heatmap_de"
    anchor: "heatmap_de"
    section_name: "Heatmap DGE genes"
    description: |
      "Heatmap DGE genes"

  lncrna_prediction:
    id: "lncrna_prediction"
    anchor: "lncrna_prediction"
    section_name: "Novel lncRNA: Prediction Summary"
    description: >
      Coding potential predictions for novel lncRNA candidates.
      Consensus classification is derived from CPAT, FEELnc, and PLEK.
    plot_type: "table"
    pconfig:
      id: "lncrna_prediction_table"
      title: "lncRNA Prediction Summary"
